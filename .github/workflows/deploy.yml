name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci
        working-directory: functions
      - name: Test Firestore security rules and the lead alert email
        run: npm test
      - name: Test the lead alert function
        run: npm test
        working-directory: functions
      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'move-strong-fitness' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    # Deploys the site to Firebase Hosting and the Firestore security rules to the
    # move-strong-fitness project. Needs the FIREBASE_SERVICE_ACCOUNT repository secret.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://continuum-performance.web.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Sign in to Google Cloud
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret (see README → Deploying)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy hosting and Firestore rules and indexes
        run: npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project move-strong-fitness --non-interactive
      # The new-lead email alert needs a Resend API key. Until the RESEND_API_KEY
      # repository secret exists, this is skipped and the hub works without alerts.
      - name: Deploy the lead alert function
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "::notice::RESEND_API_KEY secret not set; skipping the lead alert function."
            exit 0
          fi
          (cd functions && npm ci --omit=dev)
          printf '%s' "$RESEND_API_KEY" | npx firebase functions:secrets:set RESEND_API_KEY --data-file=- --project move-strong-fitness --non-interactive --force
          npx firebase deploy --only functions --project move-strong-fitness --non-interactive --force
